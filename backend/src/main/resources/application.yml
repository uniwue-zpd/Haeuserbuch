spring:
  application:
    name: haeuserbuch-backend

  jpa:
    show-sql: false

  flyway:
    enabled: true
    # Keep disabled by default. Enable only while adopting a known legacy
    # database that has no Flyway history, then disable it again.
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
    default-schema: public
    locations: classpath:db/migration
    schemas: public
    validate-migration-naming: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 500MB

haeuserbuch:
  files:
    upload-dir: ${HAEUSERBUCH_UPLOAD_DIR:/uploads}

server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
