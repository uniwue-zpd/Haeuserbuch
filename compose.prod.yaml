name: ${COMPOSE_PROJECT_NAME:-haeuserbuch-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-security: &app-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  database:
    image: ${POSTGIS_IMAGE:-imresamu/postgis:17-3.5-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:-haeuserbuch}
      POSTGRES_USER: ${DB_USER:-haeuserbuch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./database/init/01-enable-postgis.sql
        target: /docker-entrypoint-initdb.d/01-enable-postgis.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-haeuserbuch} -d ${DB_NAME:-haeuserbuch}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  tileserver:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:v5.4.0}
    command: ["--config", "/config/config.json", "--public_url", "/tiles/"]
    volumes:
      - ${TILES_DIR:-./tiles}:/data:ro
      - ./tileserver/config.json:/config/config.json:ro
      - ./tileserver/styles:/config/styles:ro
    healthcheck:
      test: ["CMD-SHELL", "node /usr/src/app/src/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ${HAEUSERBUCH_BACKEND_IMAGE:-haeuserbuch-backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-haeuserbuch}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-haeuserbuch}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      # Enable explicitly only for the first migration of the legacy database.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      HAEUSERBUCH_UPLOAD_DIR: /uploads
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    volumes:
      - type: bind
        source: ${UPLOADS_DIR:?Set UPLOADS_DIR in the production environment file}
        target: /uploads
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 30s
    logging: *default-logging
    <<: *app-security

  frontend:
    image: ${HAEUSERBUCH_FRONTEND_IMAGE:-haeuserbuch-frontend:local}
    environment:
      NODE_ENV: production
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_API_BASE_URL: http://backend:8080
      NUXT_TILESERVER_API_URL: http://tileserver:8080
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL}
      NUXT_OAUTH_KEYCLOAK_REALM: ${NUXT_OAUTH_KEYCLOAK_REALM}
      NUXT_OAUTH_KEYCLOAK_CLIENT_ID: ${NUXT_OAUTH_KEYCLOAK_CLIENT_ID}
      NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: ${NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      tileserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 15s
    logging: *default-logging
    <<: *app-security

  db_backup:
    image: ${HAEUSERBUCH_BACKUP_IMAGE:-haeuserbuch-db-backup:local}
    profiles: ["backup"]
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-haeuserbuch}
      DB_USER: ${DB_USER:-haeuserbuch}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
