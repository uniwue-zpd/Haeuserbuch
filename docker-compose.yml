services:
  frontend:
    environment:
      - NUXT_API_BASE_URL=${NUXT_API_BASE_URL}
      - NUXT_TILESERVER_API_URL=${NUXT_TILESERVER_API_URL}
    build:
      context: ./haeuserbuch_frontend
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./haeuserbuch_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - ${WORKSPACE:?error}/uploads:/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: always

  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      # In case you have a database dump, uncomment the following line and change the file name
      # - ./<your_dump>.sql:/docker-entrypoint-initdb.d/<your_dump>.sql
      - ${WORKSPACE:?error}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 30s
      retries: 10
      start_period: 60s
    restart: always

  db_backup:
    build:
      context: ./db_backup
    environment:
      - DB_HOST=database # Host is the service name of the database container
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ${BACKUPS:?error}:/backups
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine-slim
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    ports:
      - "${PORT_NGINX:-80}:80"
    depends_on:
      - frontend
    restart: always

  tileserver:
    image: maptiler/tileserver-gl:v5.4.0
    volumes:
      - ${WORKSPACE:?error}/tiles:/data
    command: --public_url /tiles/
    restart: always
